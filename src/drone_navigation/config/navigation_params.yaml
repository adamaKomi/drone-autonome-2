navigation_safety_node:
  ros__parameters:
    low_battery_threshold: 20.0
    min_takeoff_altitude: 0.8
    max_speed: 15.0
    safety_check_rate: 1.0

gps_navigation_node:
  ros__parameters:
    default_tolerance: 2.0
    navigation_timeout: 300.0
    max_retry_attempts: 3
    # Configuration de l'altitude
    altitude_mode: "relative"  # "relative" ou "absolute"
    relative_altitude_default: 50.0  # Altitude relative par défaut en mètres
    min_safe_altitude: 100.0  # Altitude AMSL minimale de sécurité en mètres
    setpoint_rate: 10.0  # Fréquence de publication des setpoints

mission_manager_node:
  ros__parameters:
    default_mission_mode: "SEQUENTIAL"
    max_loops: 0
    waypoint_timeout: 60.0
    status_publish_rate: 1.0
    max_mission_time: 3600.0

waypoint_manager_node:
  ros__parameters:
    default_waypoints_dir: "./waypoints"
    auto_save_interval: 60.0
    max_waypoints: 100
    auto_save: true
    publish_rate: 2.0

emergency_handler_node:
  ros__parameters:
    low_battery_threshold: 20.0
    critical_battery_threshold: 5.0
    gps_timeout: 10.0
    comms_timeout: 10.0
    return_home_altitude: 40.0
    emergency_action_cooldown: 30.0

navigation_supervisor_node:
  ros__parameters:
    state_timeout: 120.0
    max_navigation_time: 3600.0
    emergency_response_delay: 2.0
    supervision_rate: 1.0

local_navigation_node:
  ros__parameters:
    default_tolerance: 1.0
    default_speed: 2.0
    max_velocity: 5.0
    position_update_rate: 10.0