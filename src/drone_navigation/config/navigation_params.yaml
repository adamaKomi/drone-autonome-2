# Configuration principale du système de navigation
# Auteur: Adama Komi
# Date: 2025-09-11

# Paramètres de navigation
navigation:
  max_velocity: 10.0              # Vitesse maximale (m/s)
  max_acceleration: 3.0           # Accélération maximale (m/s²)
  planning_frequency: 10.0        # Fréquence de planification (Hz)
  control_frequency: 50.0         # Fréquence de contrôle (Hz)
  waypoint_tolerance: 1.0         # Tolérance d'arrivée aux waypoints (m)
  
# Paramètres de sécurité
safety:
  min_altitude: 2.0               # Altitude minimale (m)
  max_altitude: 120.0             # Altitude maximale (m)
  safety_distance: 5.0            # Distance de sécurité obstacles (m)
  emergency_descent_rate: 2.0     # Vitesse de descente d'urgence (m/s)
  battery_warning_threshold: 20.0 # Seuil d'alerte batterie (%)
  battery_critical_threshold: 10.0 # Seuil critique batterie (%)
  
# Algorithmes de planification
algorithms:
  default_planner: "astar"        # Planificateur par défaut (astar, rrt_star, dijkstra)
  optimization_enabled: true      # Activer l'optimisation génétique
  obstacle_avoidance: "potential_field"  # Méthode d'évitement (potential_field, reactive)
  path_smoothing_enabled: true    # Activer le lissage des trajectoires
  
# Limites de l'espace de vol
flight_envelope:
  x_min: -100.0                   # Limite ouest (m)
  x_max: 100.0                    # Limite est (m)
  y_min: -100.0                   # Limite sud (m)
  y_max: 100.0                    # Limite nord (m)
  z_min: 1.0                      # Altitude minimale absolue (m)
  z_max: 150.0                    # Altitude maximale absolue (m)
  
# Configuration de la grille de planification
planning_grid:
  resolution: 1.0                 # Résolution de la grille (m)
  timeout: 10.0                   # Timeout de planification (s)
  max_iterations: 10000           # Nombre max d'itérations
  
# Paramètres spécifiques A*
astar:
  heuristic_weight: 1.0           # Poids de l'heuristique
  diagonal_cost: 1.414            # Coût diagonal (sqrt(2))
  
# Paramètres spécifiques RRT*
rrt_star:
  max_iterations: 5000            # Itérations maximales
  step_size: 2.0                  # Taille du pas (m)
  goal_bias: 0.1                  # Biais vers l'objectif (0-1)
  search_radius: 5.0              # Rayon de recherche pour rewiring (m)
  goal_region_radius: 2.0         # Rayon de la région objectif (m)
  
# Contraintes de mouvement
movement_constraints:
  max_climb_angle: 30.0           # Angle de montée max (degrés)
  max_descent_angle: 45.0         # Angle de descente max (degrés)
  min_turn_radius: 2.0            # Rayon de virage minimum (m)
  max_climb_rate: 5.0             # Vitesse de montée max (m/s)
  max_descent_rate: 3.0           # Vitesse de descente max (m/s)
  
# Configuration MAVROS
mavros:
  namespace: "/mavros"            # Namespace MAVROS
  connection_timeout: 5.0         # Timeout de connexion (s)
  command_timeout: 10.0           # Timeout des commandes (s)
  heartbeat_frequency: 10.0       # Fréquence heartbeat (Hz)
  local_frame: "map"              # Frame de référence local
  global_frame: "earth"           # Frame de référence global
  
# Fréquences de publication
publishing:
  status_frequency: 2.0           # Fréquence statut système (Hz)
  position_frequency: 50.0        # Fréquence position (Hz)
  path_frequency: 1.0             # Fréquence trajectoire (Hz)
  metrics_frequency: 0.5          # Fréquence métriques (Hz)
  
# Configuration des timeouts
timeouts:
  node_response: 5.0              # Timeout réponse nœuds (s)
  service_call: 3.0               # Timeout appels service (s)
  navigation: 300.0               # Timeout navigation globale (s)
  emergency_response: 2.0         # Timeout réponse urgence (s)
  
# Mode de développement
development:
  simulation_mode: true           # Mode simulation
  debug_enabled: false            # Activer debug
  log_level: "INFO"               # Niveau de log (DEBUG, INFO, WARN, ERROR)
  auto_planning_enabled: true     # Planification automatique
  
# Configuration réseau
network:
  ros_domain_id: 0                # Domaine ROS2
  discovery_timeout: 30.0         # Timeout découverte nœuds (s)
  
# Métriques et monitoring
monitoring:
  health_check_frequency: 1.0     # Fréquence vérification santé (Hz)
  statistics_window: 60.0         # Fenêtre statistiques (s)
  performance_logging: true       # Activer logging performance
  
# Configuration de sauvegarde
backup:
  auto_save_enabled: false        # Sauvegarde automatique config
  backup_interval: 300.0          # Intervalle sauvegarde (s)
  max_backup_files: 10            # Nombre max fichiers backup
