# Configuration générale du système de navigation drone
# drone_navigation/config/drone_config.yaml

# === PARAMÈTRES SYSTÈME ===
system:
  node_prefix: "/drone_nav"
  update_rate_hz: 50.0
  timeout_seconds: 10.0
  max_retries: 3

# === CONFIGURATION MAVROS ===
mavros:
  connection_url: "udp://:14540@localhost:14557"
  system_id: 1
  component_id: 1
  target_system_id: 1
  target_component_id: 1
  heartbeat_rate_hz: 1.0

# === PARAMÈTRES NAVIGATION ===
navigation:
  # Frames de référence
  global_frame: "map"
  local_frame: "base_link"
  
  # Limites de sécurité
  max_velocity: 5.0  # m/s
  max_acceleration: 2.0  # m/s²
  max_altitude: 100.0  # m
  min_altitude: 2.0   # m
  
  # Tolérances
  position_tolerance: 0.5  # m
  yaw_tolerance: 0.1       # rad
  velocity_tolerance: 0.2  # m/s

# === PLANIFICATION TRAJECTOIRE ===
trajectory_planning:
  # Algorithmes disponibles
  default_algorithm: "a_star"
  algorithms:
    a_star:
      heuristic_weight: 1.2
      diagonal_cost: 1.414
    rrt_star:
      max_iterations: 1000
      step_size: 1.0
      goal_tolerance: 0.5
    dijkstra:
      max_nodes: 10000

  # Optimisation
  optimization:
    enabled: true
    max_iterations: 100
    smoothing_factor: 0.8

# === PATTERNS DE COUVERTURE ===
coverage_patterns:
  zigzag:
    default_spacing: 2.0  # m
    overlap: 0.1          # 10%
    turn_radius: 1.0      # m
  
  spiral:
    default_spacing: 2.0  # m
    center_mode: "auto"   # auto, manual
    direction: "clockwise" # clockwise, counterclockwise
  
  grid:
    default_spacing: 2.0  # m
    pattern: "row_major"  # row_major, column_major

# === CONTRÔLEUR POSITION ===
position_controller:
  pid_x:
    kp: 1.0
    ki: 0.1
    kd: 0.05
    max_integral: 10.0
    max_output: 5.0
  
  pid_y:
    kp: 1.0
    ki: 0.1
    kd: 0.05
    max_integral: 10.0
    max_output: 5.0
  
  pid_z:
    kp: 1.5
    ki: 0.2
    kd: 0.1
    max_integral: 5.0
    max_output: 3.0

# === SUIVI TRAJECTOIRE ===
trajectory_follower:
  # Algorithme Pure Pursuit
  pure_pursuit:
    lookahead_distance: 2.0  # m
    min_lookahead: 1.0       # m
    max_lookahead: 5.0       # m
  
  # Algorithme Stanley
  stanley:
    k_e: 0.3  # Gain erreur latérale
    k_v: 10.0 # Gain vitesse
  
  # Paramètres généraux
  max_linear_velocity: 3.0   # m/s
  max_angular_velocity: 1.0  # rad/s

# === GÉOFENCE ===
geofence:
  enabled: true
  action_on_breach: "return_to_safe"  # stop, land, return_to_safe, rtl
  
  # Zone par défaut (à surcharger via mission)
  default_fence:
    type: "polygon"
    vertices:
      - {x: -50.0, y: -50.0}
      - {x: 50.0, y: -50.0}
      - {x: 50.0, y: 50.0}
      - {x: -50.0, y: 50.0}
  
  # Altitudes
  max_altitude: 100.0  # m
  min_altitude: 2.0    # m

# === GESTION URGENCES ===
emergency:
  # Seuils critiques
  battery_critical: 15.0    # %
  battery_warning: 25.0     # %
  link_timeout: 5.0         # s
  
  # Actions automatiques
  auto_land_on_critical_battery: true
  auto_rtl_on_link_loss: true
  emergency_land_descent_rate: 1.0  # m/s

# === CAPTEURS ===
sensors:
  # GPS
  gps:
    min_satellites: 6
    max_hdop: 2.0
    required_fix_type: 3  # 3D fix
  
  # IMU
  imu:
    calibration_required: true
    max_gyro_bias: 0.1    # rad/s
    max_accel_bias: 0.5   # m/s²
  
  # Batterie
  battery:
    cell_count: 3
    nominal_voltage: 11.1  # V
    critical_voltage: 10.5 # V

# === MISSIONS ===
missions:
  # Répertoires
  default_directory: "./missions"
  backup_directory: "./missions/backup"
  
  # Validation
  max_waypoints: 1000
  max_mission_duration: 3600  # s
  
  # Sécurité
  validate_geofence: true
  require_rtl_waypoint: true

# === LOGGING ===
logging:
  # Niveaux: DEBUG, INFO, WARN, ERROR
  level: "INFO"
  
  # Destinations
  console: true
  file: true
  log_directory: "/tmp/drone_navigation_logs"
  
  # Rotation
  max_file_size_mb: 10
  max_files: 5

# === DIAGNOSTICS ===
diagnostics:
  # Fréquences de vérification
  system_check_hz: 1.0
  sensor_check_hz: 5.0
  communication_check_hz: 2.0
  
  # Seuils d'alerte
  cpu_usage_warning: 70.0    # %
  memory_usage_warning: 80.0 # %
  disk_usage_warning: 85.0   # %

# === COMMUNICATION ===
communication:
  # Topics ROS2
  topics:
    pose: "/drone_nav/current_pose"
    velocity: "/drone_nav/cmd_vel"
    goal: "/drone_nav/goal_position"
    mission: "/drone_nav/mission"
    status: "/drone_nav/status"
  
  # QoS Profiles
  qos:
    reliable: true
    durability: "volatile"
    history_depth: 10
