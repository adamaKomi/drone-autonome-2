# Configuration MAVROS pour la navigation
mavros:
  ros__parameters:
    fcu_url: "udp://:14540@127.0.0.1:14557"
    gcs_url: ""
    target_system_id: 1
    target_component_id: 1
    fcu_protocol: "v2.0"
    
    # Rates de publication
    rate: 50.0
    attitude_rate: 30.0
    position_rate: 30.0
    gps_rate: 10.0
    battery_rate: 5.0