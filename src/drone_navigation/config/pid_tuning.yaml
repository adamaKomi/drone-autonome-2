# Configuration des contrôleurs PID
# Auteur: Adama Komi
# Date: 2025-09-11

# Contrôleur PID pour position X
pid_controllers:
  position_x:
    kp: 1.2                       # Gain proportionnel
    ki: 0.1                       # Gain intégral
    kd: 0.05                      # Gain dérivé
    max_output: 5.0               # Sortie maximale (m/s)
    min_output: -5.0              # Sortie minimale (m/s)
    max_integral: 2.0             # Saturation terme intégral
    min_integral: -2.0            # Saturation terme intégral (anti-windup)
    derivative_filter_alpha: 0.1  # Filtre passe-bas dérivée (0-1)
    
  # Contrôleur PID pour position Y
  position_y:
    kp: 1.2                       
    ki: 0.1                       
    kd: 0.05                      
    max_output: 5.0               
    min_output: -5.0              
    max_integral: 2.0             
    min_integral: -2.0            
    derivative_filter_alpha: 0.1  
    
  # Contrôleur PID pour position Z (altitude)
  position_z:
    kp: 2.0                       # Plus agressif pour l'altitude
    ki: 0.2                       
    kd: 0.08                      
    max_output: 3.0               # Vitesse verticale limitée
    min_output: -3.0              
    max_integral: 1.5             
    min_integral: -1.5            
    derivative_filter_alpha: 0.15 
    
  # Contrôleur PID pour orientation (yaw)
  yaw:
    kp: 1.5                       
    ki: 0.05                      
    kd: 0.1                       
    max_output: 1.0               # Vitesse angulaire max (rad/s)
    min_output: -1.0              
    max_integral: 0.5             
    min_integral: -0.5            
    derivative_filter_alpha: 0.2  
    
# Modes de contrôle
control_modes:
  precision_mode:
    enabled: true                 # Mode précision activé
    tolerance: 0.5                # Tolérance mode précision (m)
    approach_distance: 3.0        # Distance d'activation approche (m)
    reduced_gains_factor: 0.7     # Facteur de réduction des gains
    
  aggressive_mode:
    enabled: false                # Mode agressif (pour tests uniquement)
    gain_multiplier: 1.5          # Multiplicateur des gains
    max_velocity_override: 15.0   # Vitesse max en mode agressif
    
  altitude_hold:
    enabled: true                 # Maintien d'altitude automatique
    tolerance: 0.2                # Tolérance maintien altitude (m)
    compensation_enabled: true    # Compensation dérive barométrique
    
# Configuration adaptive
adaptive_control:
  enabled: true                   # Contrôle adaptatif activé
  learning_rate: 0.01             # Taux d'apprentissage
  adaptation_threshold: 2.0       # Seuil d'adaptation (erreur)
  max_gain_change: 0.1            # Changement max des gains par cycle
  
# Filtres et lissage
filtering:
  input_filter_enabled: true      # Filtre sur les entrées
  input_filter_cutoff: 10.0       # Fréquence de coupure filtre (Hz)
  output_filter_enabled: true     # Filtre sur les sorties
  output_filter_cutoff: 20.0      # Fréquence de coupure sortie (Hz)
  
# Anti-windup et saturation
anti_windup:
  method: "conditional"           # Méthode anti-windup (conditional, back_calculation)
  back_calculation_gain: 0.8      # Gain pour back-calculation
  integral_clamping: true         # Limitation terme intégral
  
# Détection et gestion des erreurs
error_handling:
  max_steady_state_error: 1.0     # Erreur statique max tolérée (m)
  max_transient_error: 5.0        # Erreur transitoire max (m)
  error_timeout: 10.0             # Timeout pour erreur persistante (s)
  reset_on_large_error: true      # Reset intégrateur sur grosse erreur
  large_error_threshold: 10.0     # Seuil grosse erreur (m)
  
# Réglage automatique (auto-tuning)
auto_tuning:
  enabled: false                  # Auto-tuning activé
  method: "ziegler_nichols"       # Méthode (ziegler_nichols, cohen_coon)
  test_amplitude: 1.0             # Amplitude test (m)
  test_duration: 30.0             # Durée test (s)
  settling_time_target: 5.0       # Temps d'établissement cible (s)
  overshoot_target: 10.0          # Dépassement cible (%)
  
# Profils de gains prédéfinis
gain_profiles:
  conservative:
    description: "Gains conservateurs pour débutants"
    position_x: {kp: 0.8, ki: 0.05, kd: 0.03}
    position_y: {kp: 0.8, ki: 0.05, kd: 0.03}
    position_z: {kp: 1.2, ki: 0.1, kd: 0.05}
    
  balanced:
    description: "Gains équilibrés pour usage normal"
    position_x: {kp: 1.2, ki: 0.1, kd: 0.05}
    position_y: {kp: 1.2, ki: 0.1, kd: 0.05}
    position_z: {kp: 2.0, ki: 0.2, kd: 0.08}
    
  aggressive:
    description: "Gains agressifs pour experts"
    position_x: {kp: 1.8, ki: 0.15, kd: 0.08}
    position_y: {kp: 1.8, ki: 0.15, kd: 0.08}
    position_z: {kp: 3.0, ki: 0.3, kd: 0.12}
    
# Configuration spécifique aux conditions
environmental_adaptation:
  wind_compensation:
    enabled: true                 # Compensation du vent
    max_wind_speed: 10.0          # Vitesse vent max (m/s)
    gain_increase_factor: 1.2     # Facteur d'augmentation gains
    
  payload_compensation:
    enabled: true                 # Compensation charge utile
    payload_mass: 0.0             # Masse charge utile (kg)
    inertia_compensation: true    # Compensation inertie
    
  altitude_scaling:
    enabled: true                 # Adaptation selon altitude
    reference_altitude: 10.0      # Altitude de référence (m)
    density_compensation: true    # Compensation densité air
    
# Logging et diagnostics
diagnostics:
  performance_logging: true       # Log des performances
  error_logging: true            # Log des erreurs
  gain_change_logging: true      # Log changements gains
  statistics_window: 60.0        # Fenêtre statistiques (s)
  
# Limites de sécurité
safety_limits:
  max_acceleration: 5.0          # Accélération max (m/s²)
  max_jerk: 10.0                 # Jerk max (m/s³)
  emergency_stop_deceleration: 8.0 # Décélération arrêt urgence (m/s²)
  
# Configuration des tests
testing:
  step_response_enabled: false   # Test réponse indicielle
  frequency_response_enabled: false # Test réponse fréquentielle
  stability_margin_check: true   # Vérification marges stabilité
  
# Paramètres de simulation
simulation:
  noise_enabled: false           # Bruit sur les mesures
  noise_variance: 0.01           # Variance du bruit
  delay_simulation: false        # Simulation retards
  actuator_delay: 0.02           # Retard actionneur (s)
