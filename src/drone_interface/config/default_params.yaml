# Configuration par défaut pour l'interface drone
# =================================================

# Paramètres de sécurité
safety:
  min_battery_voltage: 10.5        # Tension minimale de batterie (V)
  min_battery_percentage: 20.0     # Pourcentage minimal de batterie (%)
  max_altitude: 120.0              # Altitude maximale autorisée (m)
  min_gps_satellites: 6            # Nombre minimal de satellites GPS
  max_hdop: 2.0                    # HDOP maximal acceptable
  max_wind_speed: 15.0             # Vitesse de vent maximale (m/s)

# Paramètres de communication
communication:
  heartbeat_timeout: 5.0           # Timeout du heartbeat MAVROS (s)
  service_timeout: 30.0            # Timeout des appels de service (s)
  retry_attempts: 3                # Nombre de tentatives de retry
  connection_check_rate: 1.0       # Fréquence de vérification connexion (Hz)

# Paramètres de performance
performance:
  status_rate: 10.0                # Fréquence de publication du statut (Hz)
  health_check_rate: 1.0           # Fréquence des vérifications santé (Hz)
  diagnostics_rate: 0.5            # Fréquence des diagnostics (Hz)
  max_cpu_usage: 80.0              # Utilisation CPU maximale (%)
  max_memory_usage: 80.0           # Utilisation mémoire maximale (%)

# Paramètres de logging
logging:
  level: "INFO"                    # Niveau de log (DEBUG, INFO, WARN, ERROR)
  enable_file_logging: true        # Activation du logging fichier
  log_directory: "/tmp/drone_logs" # Répertoire des logs
  max_log_size: "10MB"             # Taille max d'un fichier de log

# Paramètres MAVROS
mavros:
  namespace: "/mavros"             # Namespace des topics MAVROS
  connection_url: "udp://127.0.0.1:14550@14555"  # URL de connexion
  system_id: 1                     # System ID MAVLink
  component_id: 1                  # Component ID MAVLink

# Paramètres d'urgence
emergency:
  auto_disarm_on_critical: true    # Désarmement auto en cas critique
  auto_land_on_low_battery: true   # Atterrissage auto batterie faible
  emergency_land_speed: 1.0        # Vitesse d'atterrissage d'urgence (m/s)
  
# Paramètres de navigation
navigation:
  home_position_required: true     # Position home requise avant armement
  max_distance_from_home: 500.0    # Distance max depuis home (m)
  min_takeoff_altitude: 2.0        # Altitude minimale de décollage (m)
  default_takeoff_altitude: 10.0   # Altitude par défaut de décollage (m)
