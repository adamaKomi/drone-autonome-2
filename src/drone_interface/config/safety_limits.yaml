# Limites de sécurité spécifiques
# ================================

# Limites critiques - déclenchent un arrêt d'urgence
critical_limits:
  battery:
    voltage_min: 9.5               # Tension critique (V) - atterrissage forcé
    percentage_min: 10.0           # Pourcentage critique (%) - atterrissage forcé
    current_max: 50.0              # Courant maximal (A)
    
  altitude:
    max_absolute: 150.0            # Altitude absolue maximale (m)
    min_ground_clearance: 0.5      # Hauteur sol minimale (m)
    
  navigation:
    max_speed_horizontal: 20.0     # Vitesse horizontale max (m/s)
    max_speed_vertical: 10.0       # Vitesse verticale max (m/s)
    max_acceleration: 10.0         # Accélération maximale (m/s²)
    
  gps:
    hdop_critical: 5.0             # HDOP critique
    satellites_critical: 4         # Nb satellites critique
    
  connection:
    heartbeat_timeout_critical: 10.0  # Timeout critique heartbeat (s)

# Limites d'avertissement - génèrent des warnings
warning_limits:
  battery:
    voltage_warning: 10.8          # Tension d'avertissement (V)
    percentage_warning: 25.0       # Pourcentage d'avertissement (%)
    
  altitude:
    warning_height: 100.0          # Altitude d'avertissement (m)
    
  navigation:
    speed_warning: 15.0            # Vitesse d'avertissement (m/s)
    distance_home_warning: 300.0   # Distance home d'avertissement (m)
    
  gps:
    hdop_warning: 2.5              # HDOP d'avertissement
    satellites_warning: 6          # Nb satellites d'avertissement

# Zones de sécurité géographiques
geo_fencing:
  enabled: true
  
  # Zone autorisée (coordonnées GPS)
  allowed_zone:
    center_lat: 0.0                # Latitude centre (à configurer)
    center_lon: 0.0                # Longitude centre (à configurer)
    radius: 1000.0                 # Rayon autorisé (m)
    
  # Zones interdites
  forbidden_zones:
    - name: "Aéroport"
      lat: 0.0                     # Latitude (à configurer)
      lon: 0.0                     # Longitude (à configurer) 
      radius: 5000.0               # Rayon interdit (m)
      
  # Altitude par zones
  altitude_zones:
    - name: "Zone résidentielle"
      max_altitude: 50.0           # Altitude max dans cette zone (m)
      polygon: []                  # Coordonnées du polygone

# Conditions météorologiques
weather_limits:
  wind_speed_max: 12.0             # Vitesse vent max (m/s)
  wind_gust_max: 15.0              # Rafale max (m/s)
  rain_intensity_max: 2.0          # Intensité pluie max (mm/h)
  visibility_min: 1000.0           # Visibilité min (m)
  temperature_min: -10.0           # Température min (°C)
  temperature_max: 50.0            # Température max (°C)

# Paramètres de récupération d'urgence
emergency_recovery:
  rtl_altitude: 50.0               # Altitude Return-To-Launch (m)
  land_speed: 1.0                  # Vitesse atterrissage (m/s)
  hover_time_before_land: 10.0     # Temps de hover avant atterrissage (s)
  
  # Actions selon le type d'urgence
  actions:
    battery_critical: "LAND"       # LAND, RTL, HOVER
    gps_loss: "RTL"               # Action en cas de perte GPS
    connection_loss: "RTL"        # Action en cas de perte connexion
    geofence_breach: "RTL"        # Action sortie géofence
    
# Vérifications pré-vol obligatoires
preflight_checks:
  required:
    - "battery_level"
    - "gps_fix"
    - "compass_calibration"
    - "imu_calibration"
    - "rc_connection"
    - "home_position_set"
    
  optional:
    - "weather_check"
    - "airspace_check"
    - "mission_validation"

# Intervalles de vérification
check_intervals:
  safety_check: 0.1               # Vérifications sécurité (s)
  battery_trend: 5.0              # Analyse tendance batterie (s)
  gps_quality: 1.0                # Qualité GPS (s)
  system_health: 2.0              # Santé système (s)
