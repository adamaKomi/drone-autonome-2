navigation_node:
  ros__parameters:
    navigation:
      position_control:
        pid_gains:
          position:
            p_xy: 1.0
            i_xy: 0.1
            d_xy: 0.05
            p_z: 1.5
            i_z: 0.2
            d_z: 0.1
          velocity:
            p_xy: 0.8
            i_xy: 0.05
            d_xy: 0.02
        limits:
          max_velocity_xy: 10.0
          max_velocity_z: 5.0
          max_acceleration: 5.0
          max_jerk: 10.0

      trajectory:
        planning:
          lookahead_distance: 10.0
          path_resolution: 1.0
          smoothing_factor: 0.8
          turn_radius_min: 2.0
        optimization:
          algorithm: "genetic"
          population_size: 50
          generations: 100
          mutation_rate: 0.1

      coverage:
        patterns:
          zigzag:
            overlap_percentage: 20
            turn_radius: 5.0
          spiral:
            spacing: 5.0
            max_radius: 100.0
          lawn_mower:
            stripe_width: 10.0
            turn_style: "sharp"

      obstacles:
        detection:
          enabled: true
          safety_margin: 2.0
          max_detection_range: 50.0
        avoidance:
          method: "potential_fields"
          repulsion_strength: 1.0
          attraction_strength: 0.5

      geofence:
        enabled: true
        action: "RTL"
        buffer_distance: 5.0
        altitude_limits:
          min: 5.0
          max: 120.0

      safety:
        emergency:
          rtl_altitude: 50.0
          emergency_descent_rate: 2.0
          communication_timeout: 10.0
        limits:
          max_tilt_angle: 45.0
          min_battery_rtl: 25.0
          max_wind_speed: 15.0

      performance:
        update_rates:
          position_control: 50.0
          trajectory_planning: 10.0
          obstacle_detection: 20.0
          status_publishing: 5.0
